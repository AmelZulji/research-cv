# ============================================================
# IDENTITY
# ============================================================

# Square images work best because the template applies
# a circular crop.
photo: "assets/photo.jpg"

name: "Your Name"
title: "Your Professional Title"


# Contact keys correspond to:
# assets/location.svg
# assets/email.svg
# assets/github.svg
# assets/bluesky.svg
# assets/linkedin.svg
contact:
  location: "City, Country"
  email: "name@example.org"
  github: "github-username"
  bluesky: "@bluesky-handle.example"
  linkedin: "linkedin-profile"


# Aim for approximately 50–80 words.
profile: >
  Professional working at the intersection of research, technology, and
  problem solving. Experienced in developing rigorous approaches to complex
  questions, working across disciplines, and translating technical work into
  clear and useful outcomes. Combines subject-matter expertise with analytical
  thinking, reproducible workflows, and collaborative project work.


# ============================================================
# SKILLS
#
# Structure:
# Major skill area
#   → skill category
#       → tags
# ============================================================

skills:
  Domain Expertise:
    Core Methods:
      - "core method"
      - "specialized technique"
      - "experimental design"
      - "quality control"

    Applied Methods:
      - "sample processing"
      - "method development"
      - "technical workflows"
      - "documentation"

  Data & Technology:
    Analysis:
      - "data analysis"
      - "statistical modeling"
      - "data visualization"
      - "machine learning"

    Tools & Platforms:
      - "Software 1"
      - "Software 2"
      - "Programming language"
      - "Version control"
      - "Computing platform"


# ============================================================
# LANGUAGES
# ============================================================

languages:
  - "Language 1 · Native"
  - "Language 2 · Fluent"
  - "Language 3 · Intermediate"


# ============================================================
# EDUCATION
#
# Most recent / highest qualification first.
# ============================================================

education:
  - degree: "Highest Degree in Subject"
    institution: "Institution Name"
    dates: "year–year"

  - degree: "Previous Degree in Subject"
    institution: "Institution Name"
    dates: "year–year"

  - degree: "Earlier Degree in Subject"
    institution: "Institution Name"
    dates: "year–year"


# ============================================================
# EXPERIENCE
#
# Use one record per position.
# Within each position, organize achievements into projects
# or responsibility areas.
# ============================================================

experience:
  - role: "Current or Most Recent Position"
    organization: "Organization Name · Department or Group"
    dates: "year–year"

    projects:
      - title: "Main project, research topic, or responsibility area"
        bullets:
          - "Describe the problem you addressed, your individual contribution, and the scale or context of the work."
          - "Explain the methods, tools, or approach you used and why they were appropriate for the objective."
          - "State the principal result, improvement, insight, or deliverable produced by your work."
          - "Include measurable impact, publications, presentations, products, or other concrete outcomes where possible."

      - title: "Second project or collaborative responsibility"
        bullets:
          - "Summarize your contribution within the wider team or collaboration."
          - "Mention leadership, mentoring, coordination, communication, or stakeholder responsibilities where relevant."

  - role: "Previous Position"
    organization: "Organization Name · Department or Group"
    dates: "year–year"

    projects:
      - title: "Major project, thesis topic, or responsibility area"
        bullets:
          - "Describe the central objective and the work for which you were directly responsible."
          - "Highlight a method, process, workflow, or capability you established or improved."
          - "Conclude with the scientific, technical, organizational, or public-facing outcome."


# ============================================================
# PUBLICATIONS
#
# Keep entries concise. The current renderer displays:
# title
# authors
# details
# ============================================================

publications:
  - title: "Title of First Publication"
    authors: "Your Name, Coauthor A, Coauthor B, et al."
    details: "Journal Name · Year; volume:pages"

  - title: "Title of Second Publication"
    authors: "Coauthor A, Your Name, Coauthor B, et al."
    details: "Journal Name · Year; volume:pages"

  - title: "Title of Third Publication"
    authors: "Your Name, Coauthor A, Supervising Author"
    details: "Journal Name · Year; volume:pages"


# ============================================================
# ADDITIONAL SECTIONS
#
# Rename, remove, or add sections as needed.
# Examples:
# Teaching & Mentoring
# Awards & Honors
# Invited Talks
# Professional Service
# Outreach
# Training
# ============================================================

additional:
  Teaching & Mentoring:
    - title: "Course, workshop, or mentoring activity"
      description: >
        Briefly describe your role, the audience, and the principal contribution
        or outcome.

    - title: "Second teaching or mentoring activity"
      description: >
        Summarize the scope of the activity and any materials, supervision, or
        responsibilities you provided.

  Awards & Activities:
    - title: "Award, distinction, or professional activity"
      description: >
        Briefly state the recognition, role, organization, and why it is relevant.

    - title: "Professional service or outreach activity"
      description: >
        Summarize your responsibilities and the value or impact of your contribution.